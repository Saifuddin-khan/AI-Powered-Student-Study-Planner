# =============================================
# APPLICATION
# =============================================
spring.application.name=Smart Study Planner
server.port=${PORT:8080}

# Load .env file from project root (if it exists)
spring.config.import=optional:file:.env[.properties]

# =============================================
# DATABASE (MySQL)
# WARNING: Use environment variables in PRODUCTION
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_study_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
# JWT
# WARNING: Change JWT_SECRET in PRODUCTION to a strong, random value
# =============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-days=7

# =============================================
# EMAIL (Gmail SMTP) — optional for local dev
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dev-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# =============================================
# AI — OpenAI — optional for local dev
# =============================================
openai.api.key=${OPENAI_API_KEY:}
openai.cost-per-1k-input-tokens=0.00015
openai.cost-per-1k-output-tokens=0.0006

# =============================================
# FILE STORAGE
# =============================================
file.upload-dir=${FILE_UPLOAD_DIR:uploads/profile-images}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =============================================
# MULTIPART FILE UPLOAD
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# =============================================
# AI SYLLABUS ANALYZER
# =============================================
app.syllabus.max-file-size-mb=10
tesseract.datapath=${TESSERACT_DATAPATH:C:/Program Files/Tesseract-OCR/tessdata}

# =============================================
# SWAGGER / OPENAPI
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =============================================
# ADMIN SEED
# =============================================
admin.name=${ADMIN_NAME:Admin}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.log-retention-days=90

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =============================================
# EMAIL FEATURE FLAG
# =============================================
app.email.enabled=${MAIL_ENABLED:false}

# =============================================
# GOOGLE OAUTH2
# =============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile


app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

# =============================================
# LOGGING — levels controlled by logback-spring.xml
# Set SPRING_PROFILES_ACTIVE=prod for JSON output
# =============================================
logging.level.root=INFO
